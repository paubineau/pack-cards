<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Original, deterministic microfoil. Opaque luminance controls the reflective mask. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="37" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncR type="gamma" amplitude=".8" exponent="2.5" offset="0"/><feFuncG type="gamma" amplitude=".8" exponent="2.5" offset="0"/><feFuncB type="gamma" amplitude=".8" exponent="2.5" offset="0"/><feFuncA type="table" tableValues="1 1"/></feComponentTransfer>
  </filter>
  <path fill="#777" filter="url(#grain)" d="M0 0h160v160H0z"/>
</svg>
