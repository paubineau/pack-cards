<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack Cards — standalone example</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; color: #edf1f8; background: #0c1018; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 980px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.3rem); }
    p { margin: 0 0 16px; }
    .intro { color: #a4afc0; max-width: 65ch; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin: 24px 0; }
    label { display: grid; gap: 4px; font-size: .85rem; }
    button, select { font: inherit; border: 1px solid #354056; border-radius: 8px; padding: 9px 14px; background: #192232; color: #edf1f8; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid #9dd8dc; outline-offset: 4px; }
    #stage { min-height: 700px; background: radial-gradient(ellipse at center, #20363c, #101824 70%); border: 1px solid #293345; border-radius: 20px; padding: 24px; }
    #navigation { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px 0; }
    #navigation[hidden] { display: none; }
    #status { min-height: 24px; text-align: center; color: #a4afc0; }
    .demo-card { display: flex; flex-direction: column; color: #edf1f8; }
    .demo-card .recap-card-content { text-align: center; }
    .demo-symbol { font-size: 5rem; line-height: 1.2; color: var(--accent); }
    .demo-card h2 { font-size: 1.75rem; margin: 0; }
    .demo-card p { margin: 0; }
    .demo-card .recap-card-footer { padding-top: 18px; margin-top: auto; }
    @media (max-width: 600px) { body { padding: 16px; } #stage { padding: 12px; min-height: 610px; } }
  </style>
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <main>
    <h1>Your cards. Your collection.</h1>
    <p class="intro">A standalone browser example using six fictional cards. Open the pack, move your pointer over a card, or swipe sideways to explore its materials. Reduced-motion preferences are respected automatically.</p>
    <div class="controls">
      <label>Motion
        <select id="motion"><option value="interactive">Interactive</option><option value="still">Still</option></select>
      </label>
      <label>Opening
        <select id="opening"><option value="animated">Animated</option><option value="instant">Instant</option></select>
      </label>
      <label>Pack size
        <select id="zoom"><option value="true">Compact</option><option value="false">Card size</option></select>
      </label>
      <button id="open" type="button">Open pack</button>
      <button id="reset" type="button">Reset collection</button>
    </div>
    <div id="stage" class="pack-cards"></div>
    <nav id="navigation" aria-label="Cards" hidden>
      <button id="previous" type="button">Previous</button>
      <span id="position"></span>
      <button id="next" type="button">Next</button>
    </nav>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
