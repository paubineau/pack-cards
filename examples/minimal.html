<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack Cards — starter example</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; color: #edf1f8; background: #0c1516; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; }
    main { max-width: 650px; margin: auto; }
    a { color: #a8dbcb; }
    h1 { margin: 20px 0 8px; font-size: clamp(1.7rem, 6vw, 2.4rem); }
    p { color: #b6c8c4; }
    #stage { min-height: 660px; border: 1px solid #29443e; border-radius: 20px; background: radial-gradient(ellipse at center, #213b38, #102020 75%); }
    #stage .recap-deck { width: min(100%, 370px); }
    .starter-card .recap-card-content { text-align: center; }
    .starter-card .symbol { font: 5rem/1.3 Georgia, serif; color: var(--accent); }
    .starter-card .recap-card-footer { margin-top: auto; }
    button { font: inherit; color: #102020; background: #a8dbcb; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid #a8dbcb; outline-offset: 4px; }
    #status { min-height: 3em; }
    @media (max-width: 500px) { #stage { min-height: 560px; } }
  </style>
  <script type="module" src="./minimal.js"></script>
</head>
<body>
  <main>
    <a href="./">← All examples</a>
    <h1>One pack. One card.</h1>
    <p>A complete plain JavaScript integration. Drag right across the seal or use Open pack, then move your pointer over the revealed card.</p>
    <div id="stage" class="pack-cards"></div>
    <p id="status" role="status"></p>
    <button id="open" type="button">Open pack</button>
    <button id="restart" type="button">Restart</button>
    <p>Read the <a href="./minimal.js">JavaScript</a> and <a href="./README.md">example guide</a>. No framework or backend is needed.</p>
  </main>
  <!-- Your app supplies ordinary DOM content; the library adds the presentation. -->
  <template id="card-face">
    <article class="starter-card" aria-label="The Orbit" tabindex="-1">
      <header class="recap-card-header"><span>FIELD NOTES</span><span>RARE</span></header>
      <div class="recap-card-content">
        <span class="symbol" aria-hidden="true">◎</span>
        <h2 data-foil-text>The Orbit</h2>
        <p>Some things are better discovered in motion.</p>
      </div>
      <footer class="recap-card-footer"><span>Your first collectible</span><span>01 / 01</span></footer>
    </article>
  </template>
</body>
</html>
